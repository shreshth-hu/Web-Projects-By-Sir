<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Damn Projects</title>
  </head>
  <link
    rel="shortcut icon"
    href="./imgs/logo's/Logo Damn.jpg"
    type="image/x-icon"
  />
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
      color: #fff;
      background: #000;
    }
    .preloader {
      position: fixed;
      top: 0;
      left: 0;
      overflow: hidden;
      z-index: 999;
      width: 100%;
      height: 100vh;
      display: flex;
      background: linear-gradient(to right, #000, #d8d7d7, #000);
      background-size: 95%;
      animation: loop_start 5.2s ease infinite;
    }

    @keyframes loop_start {
      to {
        background-position: 200%;
      }
    }
    .loader {
      width: 100%;
      height: 100vh;
    }

    .welcome {
      display: flex;
      color: #dc4d23;
      justify-content: center;
      font-weight: bolder;
      font-size: 2.3rem;
      margin-top: 23.5%;
      position: relative;
      animation: float 3s linear infinite;
    }
    @keyframes float {
      0% {
        transform: translateY(10px);
        opacity: 0;
      }
      100% {
        opacity: 1;
        transform: translateY(-20px);
      }
    }
    .container_all {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }
    .contents {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      align-items: center;
    }

    /* Reusable Box Class */
    .box {
      height: 33vh;
      width: 85%;
      border-radius: 18px;
      cursor: pointer;
      background: linear-gradient(to right, #00ffff, #ff00ff, #00ffff);
      background-size: 85%;
      animation: boxing 3s ease infinite;
      transition: 0.4s cubic-bezier(0.6, 0.01, 0.24, 0.99);
    }

    @keyframes boxing {
      to {
        background-position: 200%;
      }
    }

    .box:hover {
      transform: translateY(-8px);
      box-shadow:
        0 10px 30px 4px rgba(0, 255, 255, 0.3),
        0 20px 60px 4px rgba(255, 0, 255, 0.2);
      padding: 30px 12rem 30px 10rem;
    }
  </style>
  <body>
    <div>
      <div class="preloader">
        <div class="loader">
          <h2 class="welcome">Welcome to Project Mania</h2>
        </div>
      </div>

      <!-- Content Section -->
      <div class="container_all">
        <div class="contents">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  addEventListener("load", function () {
    setTimeout(function () {
      let loading = document.querySelector(".preloader");
      loading.style.display = "none";
      loading.style.visibility = "hidden";
    }, 4250);
  });
</script>
