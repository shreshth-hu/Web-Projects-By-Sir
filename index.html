<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 0;
      overflow: hidden;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
      color: #fff;
    }
    .preloader {
      width: 100%;
      height: 100vh;
      display: flex;
      background: linear-gradient(to right, #d8d7d7, #000);
      background-size: 200%;
      animation: loop_start 5.2s linear infinite;
    }

    @keyframes loop_start {
      to {
        background-position: 250%;
      }
    }
    .loader {
      width: 100%;
      height: 100vh;
    }

    .welcome {
      display: flex;
      justify-content: center;
      font-size: 2.3rem;
      margin-top: 23.5%;
      position: relative;
      animation: float 3s linear infinite;
    }
    @keyframes float {
      0% {
        transform: translateY(10px);
        opacity: 0;
      }
      100% {
        opacity: 1;
        transform: translateY(-20px);
      }
    }
  </style>
  <body>
    <div>
      <div class="preloader">
        <div class="loader">
          <h2 class="welcome">Welcome to Project Mania</h2>
        </div>
      </div>
    </div>
  </body>
</html>
