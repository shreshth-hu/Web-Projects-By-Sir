<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Damn Projects</title>
  </head>
  <style>
    * {
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 0;
      overflow: hidden;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
      color: #fff;
      background: #000;
    }
    .preloader {
      z-index: -999;
      width: 100%;
      height: 100vh;
      display: flex;
      background: linear-gradient(to right, #d8d7d7, #000);
      background-size: 200%;
      animation: loop_start 5.2s linear infinite;
    }

    @keyframes loop_start {
      to {
        background-position: 250%;
      }
    }
    .loader {
      width: 100%;
      height: 100vh;
    }

    .welcome {
      display: flex;
      justify-content: center;
      font-size: 2.3rem;
      margin-top: 23.5%;
      position: relative;
      animation: float 3s linear infinite;
    }
    @keyframes float {
      0% {
        transform: translateY(10px);
        opacity: 0;
      }
      100% {
        opacity: 1;
        transform: translateY(-20px);
      }
    }
    .container_all {
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: space-between;
    }
    .contents {
      display: flex;
      justify-content: space-between;
      height: 100vh;
      width: 100%;
      z-index: -998;
    }
    .box1 {
      height: 33vh;
      width: 85%;
      background-color: #ffff;
      border-radius: 18px;
      margin-left: 4.5%;
      margin-top: 4%;
      background: linear-gradient(to right, );
    }
  </style>
  <body>
    <div>
      <div class="preloader">
        <div class="loader">
          <h2 class="welcome">Welcome to Project Mania</h2>
        </div>
      </div>
      <!-- Ab aayega apna kon saara saamaan -->
      <div class="container_all">
        <div class="contents">
          <div class="box1"></div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  addEventListener("load", function () {
    setTimeout(function () {
      let loading = document.querySelector(".preloader");
      loading.style.display = "none";
      loading.style.visibility = "hidden";
    }, 4250);
  });
</script>
