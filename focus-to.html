<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus-List</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        overflow: hidden;
        box-sizing: border-box;
        animation: 1s load ease-in-out;
      }

      @keyframes load {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      body {
        min-height: 100vh;
        color: #172033;
        background:
          linear-gradient(
            135deg,
            rgba(35, 28, 74, 0.78),
            rgba(74, 45, 116, 0.52)
          ),
          url(./imgs/bgs/BG\ For\ To\ Do.avif) center / cover fixed;
      }
    </style>
  </head>
  <body>
    <div></div>
  </body>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</html>
