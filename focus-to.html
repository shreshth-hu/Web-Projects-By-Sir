<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus-List</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        overflow: hidden;
        box-sizing: border-box;
        animation: 1s load ease-in-out;
      }

      @keyframes load {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      body {
        min-height: 100vh;
        color: #172033;
        background:
          linear-gradient(
            135deg,
            rgba(35, 28, 74, 0.78),
            rgba(74, 45, 116, 0.52)
          ),
          url(./imgs/bgs/BG\ For\ To\ Do.avif) center / cover fixed;
      }

      h1 {
        color: #eee;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }

      .brand {
        width: 45%;
        height: 15%;
        margin-top: 5%;
        margin-left: 5%;
      }

      .logo {
        position: relative;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        font-size: 38px;
        color: #eee;
        font-weight: 800;
      }

      .lo {
        padding: 0;
        margin-left: 6.1%;
        font-size: 35px;
        position: relative;
        top: -50px;
      }

      .subtitle {
        color: #e1e3e7;
        margin-left: 4.5%;
        position: sticky;
        bottom: 42px;
      }

      #date {
        color: #e1e3e7;
      }
    </style>
  </head>
  <body>
    <div>
      <header>
        <div class="brand">
          <div class="logo">✓</div>
          <h1 class="lo">Focus List</h1>
          <div class="subtitle">Plan Task. Do task. Done task</div>
        </div>
        <span id="date"></span>
      </header>
    </div>

    <script>
      const today = new Date();
      const formattedDate = today.toLocaleDateString();
      document.getElementById("date").textContent = formattedDate;
    </script>
  </body>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</html>
